<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-itunes-app" content="app-id=6770312052" />
    <title>Recipe Sharing & Lists</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #1a1a1a; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #2a2a2a; border-radius: 16px; padding: 32px; max-width: 480px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f5a623; }
        .source { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
        h2 { font-size: 1.1rem; color: #f5a623; margin: 16px 0 8px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 4px; font-size: 0.95rem; }
        .directions { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5; }
        .app-link { display: block; text-align: center; margin-top: 24px; padding: 14px; background: #f5a623; color: #1a1a1a; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 1rem; }
        .app-link:hover { background: #e6951e; }
        .loading { text-align: center; color: #999; }
    </style>
</head>
<body>
    <div class="card">
        <div id="content" class="loading">Loading recipe...</div>
        <a class="app-link" href="https://apps.apple.com/app/id6770312052">Get Recipe Sharing & Lists</a>
    </div>
    <script>
        try {
            const fragment = window.location.hash.substring(1);
            if (!fragment) throw new Error('No data');
            let b64 = fragment.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            let json;
            try {
                const ds = new DecompressionStream('deflate');
                const writer = ds.writable.getWriter();
                writer.write(bytes);
                writer.close();
                const reader = ds.readable.getReader();
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                }
                const merged = new Uint8Array(chunks.reduce((a, c) => a + c.length, 0));
                let offset = 0;
                for (const c of chunks) { merged.set(c, offset); offset += c.length; }
                json = new TextDecoder().decode(merged);
            } catch {
                json = new TextDecoder().decode(bytes);
            }
            const recipe = JSON.parse(json);
            let html = '<h1>' + (recipe.n || 'Recipe') + '</h1>';
            if (recipe.s) html += '<p class="source">' + recipe.s + '</p>';
            if (recipe.i && recipe.i.length) {
                html += '<h2>Ingredients</h2><ul>';
                recipe.i.forEach(function(ing) { html += '<li>' + ing + '</li>'; });
                html += '</ul>';
            }
            if (recipe.d) html += '<h2>Directions</h2><div class="directions">' + recipe.d + '</div>';
            document.getElementById('content').innerHTML = html;
        } catch (e) {
            document.getElementById('content').innerHTML = '<h1>Recipe Sharing & Lists</h1><p style="margin-top:12px">Open this link on a device with the app installed to import this recipe.</p>';
        }
    </script>
</body>
</html>
